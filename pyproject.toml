[project]
name = "cvc"
version = "0.0.0"
description = "Credential vault consolidation: import, reminders, backup/recovery, and an audited agent-access broker over Vaultwarden."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",        # HIBP + broker client calls
    "paho-mqtt>=2.0",     # Home Assistant MQTT discovery
    "fastapi>=0.111",     # Phase 4 broker API
    "uvicorn>=0.30",      # broker server
    "pydantic>=2.7",      # typed models / config
    "PyYAML>=6.0",        # ACL file
    "cryptography>=42",   # tiergate client-cert parsing
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.16.6", "mypy>=1.10"]

[project.scripts]
cvc-import = "cvc.importers.__main__:main"
cvc-remind = "cvc.reminders.__main__:main"
cvc-backup = "cvc.backup.__main__:main"
cvc-broker = "cvc.broker.app:main"
cvc-access = "cvc.access.cli:main"
cvc-tiergate = "cvc.tiergate.app:main"
cvc = "cvc.takeover.__main__:main"            # `cvc takeover ...` (D15)
cvc-takeover = "cvc.takeover.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cvc.takeover" = ["faq.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
