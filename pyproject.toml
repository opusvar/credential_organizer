[project]
name = "cvc"
version = "0.0.0"
description = "Credential vault consolidation: import, reminders, backup/recovery, and an audited agent-access broker over Vaultwarden."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",        # HIBP + broker client calls
    "paho-mqtt>=2.0",     # Home Assistant MQTT discovery
    "fastapi>=0.111",     # Phase 4 broker API
    "uvicorn>=0.30",      # broker server
    "pydantic>=2.7",      # typed models / config
    "PyYAML>=6.0",        # ACL file
    "cryptography>=42",   # tiergate client-cert parsing
]

[project.optional-dependencies]
estate = ["segno>=1.5"]   # offline QR for the estate kit sheet
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.16.6", "mypy>=1.10"]

[project.scripts]
cvc-import = "cvc.importers.__main__:main"
cvc-remind = "cvc.reminders.__main__:main"
cvc-backup = "cvc.backup.__main__:main"
cvc-broker = "cvc.broker.app:main"
cvc-access = "cvc.access.cli:main"
cvc-tiergate = "cvc.tiergate.app:main"
cvc = "cvc.onboard.cli:cvc_main"               # `cvc onboard|takeover|delegate ...`
cvc-takeover = "cvc.takeover.__main__:main"
cvc-onboard = "cvc.onboard.cli:main"
cvc-delegate = "cvc.delegate.__main__:main"      # also `cvc delegate ...` (D17)
cvc-deploygen = "cvc.deploygen.__main__:main"
cvc-takeover-api = "cvc.deploygen.takeover_app:main"
cvc-site = "cvc.site:main"
cvc-approvals = "cvc.approvals.cli:main"         # D18 owner CLI: list|show|decide
cvc-audit = "cvc.audit.cli:main"              # D24 read-only audit process
cvc-escalate = "cvc.escalation.cli:main"      # D27 agent escalation
cvc-notify = "cvc.notify.__main__:main"        # ntfy push: tick (escalate/digest) | test

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cvc.takeover" = ["faq.md"]
"cvc.delegate" = ["faq.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
