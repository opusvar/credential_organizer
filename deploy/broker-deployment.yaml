---
# cvc credential broker — k3s Deployment
#
# Binds hostPort 8710 to Tailscale IP only (100.106.97.34). Never bind to 0.0.0.0.
#
# Prerequisites (one-time setup):
#   kubectl apply -f deploy/namespace.yaml
#
#   # Agent account creds (Vaultwarden dedicated agent account — NOT personal vault):
#   kubectl -n cvc create secret generic cvc-broker-vault \
#     --from-literal=BW_SERVER=https://orangepi6.humpback-krait.ts.net:8443 \
#     --from-literal=BW_CLIENTID=<agent account client id> \
#     --from-literal=BW_CLIENTSECRET=<agent account client secret> \
#     --from-literal=BW_PASSWORD=<agent account master password>
#
#   # ACL file:
#   kubectl -n cvc create secret generic cvc-broker-acl \
#     --from-file=broker-acl.yaml=deploy/broker-acl.yaml
#
#   # Audit log PersistentVolumeClaim (or swap for emptyDir during development — see NOTE below):
#   kubectl -n cvc apply -f deploy/broker-audit-pvc.yaml
#
# Session refresh: BW_SESSION is not managed by this Deployment. An init container
# or sidecar must unlock the vault and export BW_SESSION before the broker starts.
# This is noted as non-blocking (see opus-security-review.md). For now, run
# `kubectl -n cvc exec <pod> -- bw unlock --passwordenv BW_PASSWORD --raw`
# and inject the result as BW_SESSION via a Secret before scaling to 1 replica.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvc-broker
  namespace: cvc
  labels:
    app: cvc-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cvc-broker
  template:
    metadata:
      labels:
        app: cvc-broker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000       # matches the cvc user in the Dockerfile
        fsGroup: 1000
      containers:
        - name: cvc-broker
          image: cvc:latest
          imagePullPolicy: IfNotPresent
          command: ["cvc-broker"]
          ports:
            - containerPort: 8710
              hostPort: 8710
              hostIP: "100.106.97.34"   # Tailscale IP only — never 0.0.0.0
              protocol: TCP
          env:
            - name: BROKER_BIND
              value: "100.106.97.34"
            - name: BROKER_PORT
              value: "8710"
            - name: BROKER_ACL
              value: /etc/cvc/broker-acl.yaml
            - name: AUDIT_LOG
              value: /var/log/cvc/access.jsonl
          envFrom:
            - secretRef:
                name: cvc-broker-vault   # BW_SERVER, BW_CLIENTID, BW_CLIENTSECRET, BW_PASSWORD
          volumeMounts:
            - name: acl
              mountPath: /etc/cvc
              readOnly: true
            - name: audit-log
              mountPath: /var/log/cvc
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8710
              host: "100.106.97.34"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8710
              host: "100.106.97.34"
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: acl
          secret:
            secretName: cvc-broker-acl
        - name: audit-log
          # NOTE: swap for emptyDir during development (loses log on pod restart):
          # emptyDir: {}
          persistentVolumeClaim:
            claimName: cvc-broker-audit-log
      restartPolicy: Always
---
# PersistentVolumeClaim for the audit log.
# Uses the default k3s local-path storage class (single-node; survives pod restarts).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cvc-broker-audit-log
  namespace: cvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
