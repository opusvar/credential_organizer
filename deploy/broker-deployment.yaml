---
# cvc credential broker — k3s Deployment
#
# Binds hostPort 8710 to Tailscale IP (100.106.97.34) via hostIP.
# The broker itself binds 0.0.0.0 INSIDE the pod netns — the Tailscale IP
# does not exist in the pod's network namespace, only on the host's tailscale0.
# hostIP on the portmap rule is what restricts access to the Tailscale interface.
#
# Prerequisites (one-time setup):
#   kubectl apply -f deploy/namespace.yaml
#
#   # Agent account creds (Vaultwarden dedicated agent account — NOT personal vault):
#   kubectl -n cvc create secret generic cvc-broker-vault \
#     --from-literal=BW_SERVER=https://orangepi6.humpback-krait.ts.net:8443/vault \
#     --from-literal=BW_CLIENTID=<agent account client id> \
#     --from-literal=BW_CLIENTSECRET=<agent account client secret> \
#     --from-literal=BW_PASSWORD=<agent account master password>
#
#   # ACL file:
#   kubectl -n cvc create secret generic cvc-broker-acl \
#     --from-file=broker-acl.yaml=deploy/broker-acl.yaml
#
# Image: must be built into k3s containerd, not the system containerd.
#   deploy/rebuild.sh --restart        # wraps the three steps below + rollout
#
#   sudo nerdctl build -t cvc:latest .
#   sudo nerdctl save cvc:latest -o /tmp/cvc.tar
#   sudo k3s ctr -n k8s.io images import /tmp/cvc.tar
#   sudo k3s ctr -n k8s.io images ls | grep cvc   # verify before applying
#
# ORDER MATTERS: the readinessProbe below targets /readyz, which only exists in
# images built after that endpoint was added. Applying this manifest against an
# older image leaves the pod permanently NotReady (the probe 404s). Rebuild the
# image FIRST (deploy/rebuild.sh), then apply this file. Traffic itself still
# flows either way, because hostPort does not depend on readiness.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvc-broker
  namespace: cvc
  labels:
    app: cvc-broker
spec:
  replicas: 1
  strategy:
    type: Recreate   # hostPort is a node-level mutex; Recreate prevents scheduling deadlock
  selector:
    matchLabels:
      app: cvc-broker
  template:
    metadata:
      labels:
        app: cvc-broker
    spec:
      hostAliases:
        - ip: "100.106.97.34"
          hostnames:
            - "orangepi6.humpback-krait.ts.net"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000       # matches `useradd -m -u 1000 cvc` in the Dockerfile
        fsGroup: 1000
      initContainers:
        - name: bw-unlock
          image: cvc:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -eu
            - -c
            - |
              /usr/local/bin/bw config server "$BW_SERVER"
              /usr/local/bin/bw login --check || /usr/local/bin/bw login --apikey
              SESSION=$(/usr/local/bin/bw unlock --passwordenv BW_PASSWORD --raw)
              printf '%s' "$SESSION" > /run/cvc/bw-session
              [ -s /run/cvc/bw-session ] || { echo "ERROR: bw-session is empty"; exit 1; }
              echo "bw-unlock: session written"
          envFrom:
            - secretRef:
                name: cvc-broker-vault   # BW_SERVER, BW_CLIENTID, BW_CLIENTSECRET, BW_PASSWORD
          env:
            - name: HOME
              value: /home/cvc
            - name: BITWARDENCLI_APPDATA_DIR
              value: /run/cvc/bw   # shared with main container so login state persists
          volumeMounts:
            - name: bw-session
              mountPath: /run/cvc
      containers:
        - name: cvc-broker
          image: cvc:latest
          imagePullPolicy: IfNotPresent
          # Read the session key written by the init container, then start the broker.
          command:
            - sh
            - -c
            - |
              export BW_SESSION=$(cat /run/cvc/bw-session)
              exec cvc-broker
          ports:
            - containerPort: 8710
              hostPort: 8710
              hostIP: "100.106.97.34"   # restricts CNI portmap to Tailscale interface
              protocol: TCP
          env:
            - name: BROKER_BIND
              value: "0.0.0.0"   # bind inside pod netns; hostIP above restricts the host side
            - name: BROKER_PORT
              value: "8710"
            - name: BROKER_ACL
              value: /etc/cvc/broker-acl.yaml
            - name: AUDIT_LOG
              value: /var/log/cvc/access.jsonl
            - name: OPS_LOG
              value: /var/log/cvc/ops.jsonl
            - name: HOME
              value: /home/cvc
            - name: BITWARDENCLI_APPDATA_DIR
              value: /run/cvc/bw   # must match init container so bw finds its login state
            - name: BW_SERVER
              valueFrom:
                secretKeyRef:
                  name: cvc-broker-vault
                  key: BW_SERVER
          volumeMounts:
            - name: bw-session
              mountPath: /run/cvc   # not readOnly — bw writes data.json on sync
            - name: acl
              mountPath: /etc/cvc
              readOnly: true
            - name: audit-log
              mountPath: /var/log/cvc
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # /readyz shells out to `bw status` (a forked Node process), so periodSeconds is 30s
          # to stay inside the 200m CPU limit above. The endpoint caches the result for 25s, so
          # each probe costs at most one `bw` invocation. timeoutSeconds is 15, not 10: a
          # credential fetch on this ARM64 host was measured at 14.5s while the box was busy,
          # so a 10s probe timeout would flap under load and mark a healthy pod NotReady.
          # Because this pod is reached via hostPort rather than a Service, readiness does NOT
          # gate traffic — there is no load balancer to pull the pod from. It's an operational
          # signal surfaced by `kubectl get pods` and `deploy/diag.sh`.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8710
              # no host: — probe the pod IP directly, not the host portmap chain
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8710
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: bw-session
          emptyDir:
            medium: Memory   # session key and bw app-data never touch disk
        - name: acl
          secret:
            secretName: cvc-broker-acl
        - name: audit-log
          # NOTE: swap for emptyDir during development (loses log on pod restart):
          # emptyDir: {}
          persistentVolumeClaim:
            claimName: cvc-broker-audit-log
---
# PersistentVolumeClaim for the audit log.
# Uses the default k3s local-path storage class (single-node; survives pod restarts).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cvc-broker-audit-log
  namespace: cvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
