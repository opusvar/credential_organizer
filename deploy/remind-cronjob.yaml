---
# cvc-remind CronJob — evaluates vault credentials and publishes to Home Assistant via MQTT.
# Runs daily at 07:00 UTC. Adjust schedule as needed.
#
# Prerequisites:
#   kubectl create secret generic cvc-vault \
#     --from-literal=BW_SERVER=${SITE_VAULT_URL} \
#     --from-literal=BW_CLIENTID=<from Vaultwarden Account Settings → API Key> \
#     --from-literal=BW_CLIENTSECRET=<from Vaultwarden Account Settings → API Key> \
#     --from-literal=BW_PASSWORD=<vault master password>
#
#   kubectl create secret generic cvc-mqtt \
#     --from-literal=MQTT_HOST=<HA MQTT broker host> \
#     --from-literal=MQTT_USERNAME=<mqtt username> \
#     --from-literal=MQTT_PASSWORD=<mqtt password>

apiVersion: batch/v1
kind: CronJob
metadata:
  name: cvc-remind
  namespace: cvc
spec:
  schedule: "0 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # No volumes here, so no fsGroup is needed — but pin the identity anyway so this
          # pod matches the broker and backup pods (bw writes its app-data under /home/cvc,
          # which only uid 1000 owns).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000       # matches `useradd -m -u 1000 cvc` in the Dockerfile
          hostAliases:
            - ip: "${SITE_NODE_IP}"
              hostnames:
                - "${SITE_BASE_DOMAIN}"
          containers:
            - name: cvc-remind
              image: cvc:latest
              command: ["cvc-remind"]
              envFrom:
                - secretRef:
                    name: cvc-vault
                - secretRef:
                    name: cvc-mqtt
              env:
                # Phase 4 lesson: bw resolves its login/session state from
                # BITWARDENCLI_APPDATA_DIR (falling back to $HOME/.config). Set both
                # explicitly so the value does not depend on the image's ENV defaults —
                # if bw cannot find its app-data it fails with "You are not logged in."
                # even though login_apikey() succeeded moments earlier in the same process.
                - name: HOME
                  value: /home/cvc
                - name: BITWARDENCLI_APPDATA_DIR
                  value: /home/cvc/.bw
                - name: ROTATION_MAX_AGE_DAYS
                  value: "180"
                - name: HIBP_ENABLED
                  value: "true"
                - name: MQTT_PORT
                  value: "1883"
                - name: MQTT_DISCOVERY_PREFIX
                  value: "homeassistant"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
