# Broker ACL — default-deny. An agent may fetch ONLY credentials explicitly listed here, for
# the listed purposes. Unknown agents and unlisted credentials are denied.
#
# Rules:
#   credential   = Vaultwarden item UUID (not the item name). Get it from `bw get item <name> | jq .id`.
#   purposes     = required non-empty list. [] or omitted = DENY ALL. ["*"] = any purpose allowed.
#   token_sha256 = sha256 hex of the agent's service token. Generate:
#                    python -m cvc.broker.tokens   (prints token + sha256)
#
# This is a TEMPLATE with placeholder values — replace before use. Keep real ACLs out of git if
# they reveal which high-value credentials exist (this file is committed as a template only).
agents:
  playwright-example:
    token_sha256: "2b29a4e2b3572914335004f9a6d082358438d67bec2971602b2b438ea95d30e6"
    allow:
      - credential: "72c393aa-6bc7-4323-a9e7-e2d7459aa777"   # test-credential
        purposes: ["smoke-test"]
